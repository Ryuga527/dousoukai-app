<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同窓会 出欠・振込報告＆名簿管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (JSXコンパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDK (Compat版) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase設定（提供済みの設定を組み込み済み）
    const firebaseConfig = {
      apiKey: "AIzaSyCUzR6cM3_QB-FVQbnQxnEYggUeaA3GR6E",
      authDomain: "dousoukai-app-20fef.firebaseapp.com",
      projectId: "dousoukai-app-20fef",
      storageBucket: "dousoukai-app-20fef.firebasestorage.app",
      messagingSenderId: "340011014356",
      appId: "1:340011014356:web:1d9aec77f28a9ffa230341",
      measurementId: "G-3KC4MPXKDX"
    };

    // Firebase初期化
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    const DOC_REF = db.collection('dousoukai_app').doc('main_data');

    const CLASS_OPTIONS = [
      '3年1組', '3年2組', '3年3組', '3年4組',
      '3年5組', '3年6組', '3年7組', '3年8組'
    ];

    const DEFAULT_SETTINGS = {
      eventTitle: '同窓会 出欠・振込報告',
      feeAmount: 8000,
      adminPassword: 'dousoukai2026',
      eventDate: '',
      venueName: '',
      deadlineDate: '',
      bankName: '（銀行名未設定）',
      branchName: '',
      accountType: '普通',
      accountNumber: '',
      accountHolder: '',
      appUrl: typeof window !== 'undefined' ? window.location.href.split('?')[0] : ''
    };

    // カタカナ・ひらがな・スペース正規化（銀行明細照合用）
    const normalizeKana = (str) => {
      if (!str) return '';
      return str
        .replace(/[\s ・\-ー]/g, '')
        .replace(/[\u3041-\u3096]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) + 0x60))
        .toUpperCase();
    };

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [isSynced, setIsSynced] = useState(false);
      const [user, setUser] = useState(null);
      const [authError, setAuthError] = useState('');
      const [isInAppBrowser, setIsInAppBrowser] = useState(false);

      // データ状態
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [members, setMembers] = useState([]);

      // 画面モード（'participant' | 'admin'）
      const [viewMode, setViewMode] = useState('participant');
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // 参加者フォーム状態
      const [formName, setFormName] = useState('');
      const [formKana, setFormKana] = useState('');
      const [formMaidenName, setFormMaidenName] = useState('');
      const [formClass, setFormClass] = useState('3年1組');
      const [formLineName, setFormLineName] = useState('');
      const [formAttendance, setFormAttendance] = useState('参加');
      const [formTransferName, setFormTransferName] = useState('');
      const [formTransferDate, setFormTransferDate] = useState('');
      const [formTransferStatus, setFormTransferStatus] = useState('確認待ち');
      const [formNote, setFormNote] = useState('');
      const [formSubmitted, setFormSubmitted] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // 管理者画面状態
      const [adminTab, setAdminTab] = useState('list');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('ALL');
      const [filterPayment, setFilterPayment] = useState('ALL');
      const [editingMember, setEditingMember] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [bankStatementText, setBankStatementText] = useState('');
      const [matchedIds, setMatchedIds] = useState([]);
      const [lineTemplateType, setLineTemplateType] = useState('initial');
      const [copySuccess, setCopySuccess] = useState(false);
      const [newPassword, setNewPassword] = useState('');
      const [passwordChangeMsg, setPasswordChangeMsg] = useState('');

      // LINE内ブラウザ検知
      useEffect(() => {
        const ua = navigator.userAgent || '';
        if (/Line\//i.test(ua) || /FBAN|FBAV|Instagram/i.test(ua)) {
          setIsInAppBrowser(true);
        }
      }, []);

      // 認証状態＆Firestoreリアルタイム同期
      useEffect(() => {
        let unsubscribeDoc = null;

        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            setAuthError('');
            unsubscribeDoc = DOC_REF.onSnapshot(
              (docSnap) => {
                if (docSnap.exists) {
                  const data = docSnap.data();
                  if (data.settings) {
                    setSettings((prev) => ({ ...prev, ...data.settings }));
                  }
                  if (Array.isArray(data.members)) {
                    setMembers(data.members);
                  }
                } else {
                  DOC_REF.set({
                    settings: DEFAULT_SETTINGS,
                    members: []
                  });
                }
                setIsSynced(true);
                setIsLoading(false);
              },
              (err) => {
                console.error('Firestore error:', err);
                setAuthError('データの読み込みに失敗しました。Firestoreのルール設定をご確認ください。');
                setIsLoading(false);
              }
            );
          } else {
            if (unsubscribeDoc) unsubscribeDoc();
            setIsSynced(false);
            setIsLoading(false);
          }
        });

        return () => {
          unsubscribeAuth();
          if (unsubscribeDoc) unsubscribeDoc();
        };
      }, []);

      // Firestoreへ保存するヘルパー
      const saveToCloud = async (nextSettings, nextMembers) => {
        try {
          await DOC_REF.set(
            {
              settings: nextSettings,
              members: nextMembers,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            },
            { merge: true }
          );
        } catch (err) {
          console.error('Save failed:', err);
          alert('データの保存に失敗しました。通信環境をご確認ください。');
        }
      };

      // Googleログイン処理
      const handleGoogleLogin = async () => {
        setAuthError('');
        try {
          await auth.signInWithPopup(googleProvider);
        } catch (err) {
          console.error('Google Sign-In Error:', err);
          if (err.code === 'auth/popup-blocked') {
            setAuthError('ポップアップがブロックされました。ブラウザの設定で許可してください。');
          } else if (err.code === 'auth/unauthorized-domain') {
            setAuthError('このドメインはFirebaseで許可されていません。「承認済みドメイン」を確認してください。');
          } else {
            setAuthError('ログインに失敗しました。LINE内ブラウザの場合はSafariやChromeで開き直してください。');
          }
        }
      };

      const handleGoogleLogout = async () => {
        await auth.signOut();
        setViewMode('participant');
        setFormSubmitted(false);
      };

      // 参加者フォーム送信
      const handleParticipantSubmit = async (e) => {
        e.preventDefault();
        if (!user) return;
        setIsSubmitting(true);

        const paymentStatus = formAttendance === '欠席' ? '対象外' : formTransferStatus;
        const newEntry = {
          id: 'm_' + Date.now(),
          name: formName.trim(),
          kana: formKana.trim(),
          maidenName: formMaidenName.trim(),
          className: formClass,
          lineName: formLineName.trim(),
          attendance: formAttendance,
          paymentStatus: paymentStatus,
          transferName: formTransferName.trim() || formKana.trim(),
          transferDate: formTransferDate,
          note: formNote.trim(),
          googleEmail: user.email || '',
          googleUid: user.uid,
          submittedAt: new Date().toLocaleString('ja-JP')
        };

        // 同じGoogleアカウントまたは同姓同名・同クラスがあれば上書き更新、なければ新規追加
        const existingIndex = members.findIndex(
          (m) =>
            (m.googleUid && m.googleUid === user.uid) ||
            (m.name === newEntry.name && m.className === newEntry.className)
        );

        let updatedMembers;
        if (existingIndex >= 0) {
          updatedMembers = [...members];
          updatedMembers[existingIndex] = {
            ...updatedMembers[existingIndex],
            ...newEntry,
            id: updatedMembers[existingIndex].id
          };
        } else {
          updatedMembers = [newEntry, ...members];
        }

        setMembers(updatedMembers);
        await saveToCloud(settings, updatedMembers);
        setIsSubmitting(false);
        setFormSubmitted(true);
      };

      // 管理者ログイン
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === settings.adminPassword) {
          setViewMode('admin');
          setShowLoginModal(false);
          setPasswordInput('');
          setLoginError('');
        } else {
          setLoginError('パスワードが正しくありません。');
        }
      };

      // 集計値
      const stats = useMemo(() => {
        const attending = members.filter((m) => m.attendance === '参加');
        const paid = attending.filter((m) => m.paymentStatus === '振込完了');
        const pending = attending.filter((m) => m.paymentStatus === '確認待ち');
        const unpaid = attending.filter((m) => m.paymentStatus === '未振込');
        const totalExpected = attending.length * Number(settings.feeAmount || 0);
        const totalCollected = paid.length * Number(settings.feeAmount || 0);
        const rate = totalExpected > 0 ? Math.round((totalCollected / totalExpected) * 100) : 0;
        return {
          totalMembers: members.length,
          attendingCount: attending.length,
          paidCount: paid.length,
          pendingCount: pending.length,
          unpaidCount: unpaid.length,
          totalExpected,
          totalCollected,
          rate
        };
      }, [members, settings.feeAmount]);

      // 絞り込み名簿
      const filteredMembers = useMemo(() => {
        return members.filter((m) => {
          const matchClass = filterClass === 'ALL' || m.className === filterClass;
          const matchPay = filterPayment === 'ALL' || m.paymentStatus === filterPayment;
          const q = searchQuery.toLowerCase().trim();
          const matchQuery =
            !q ||
            (m.name && m.name.toLowerCase().includes(q)) ||
            (m.kana && m.kana.toLowerCase().includes(q)) ||
            (m.maidenName && m.maidenName.toLowerCase().includes(q)) ||
            (m.lineName && m.lineName.toLowerCase().includes(q)) ||
            (m.transferName && m.transferName.toLowerCase().includes(q)) ||
            (m.googleEmail && m.googleEmail.toLowerCase().includes(q));
          return matchClass && matchPay && matchQuery;
        });
      }, [members, filterClass, filterPayment, searchQuery]);

      // ステータスワンクリック切替
      const cyclePaymentStatus = async (id) => {
        const order = ['未振込', '確認待ち', '振込完了'];
        const updated = members.map((m) => {
          if (m.id !== id) return m;
          const nextIdx = (order.indexOf(m.paymentStatus) + 1) % order.length;
          return { ...m, paymentStatus: order[nextIdx] };
        });
        setMembers(updated);
        await saveToCloud(settings, updated);
      };

      const cycleAttendance = async (id) => {
        const order = ['参加', '未定', '欠席'];
        const updated = members.map((m) => {
          if (m.id !== id) return m;
          const nextIdx = (order.indexOf(m.attendance) + 1) % order.length;
          return { ...m, attendance: order[nextIdx] };
        });
        setMembers(updated);
        await saveToCloud(settings, updated);
      };

      // 銀行明細自動照合
      const runBankMatch = () => {
        const normText = normalizeKana(bankStatementText);
        if (!normText) return;
        const hits = members
          .filter((m) => m.attendance === '参加' && m.paymentStatus !== '振込完了')
          .filter((m) => {
            const tName = normalizeKana(m.transferName);
            const kName = normalizeKana(m.kana);
            return (tName && normText.includes(tName)) || (kName && normText.includes(kName));
          })
          .map((m) => m.id);
        setMatchedIds(hits);
      };

      const applyBankMatch = async () => {
        const updated = members.map((m) =>
          matchedIds.includes(m.id) ? { ...m, paymentStatus: '振込完了' } : m
        );
        setMembers(updated);
        await saveToCloud(settings, updated);
        setMatchedIds([]);
        setBankStatementText('');
        alert('選択したメンバーを「振込完了」に更新しました！');
      };

      // CSVエクスポート
      const exportCSV = () => {
        const headers = ['クラス', '氏名', 'ふりがな', '旧姓', 'LINE表示名', '出欠', '振込状況', '振込名義', '振込日', 'Googleアカウント', '備考'];
        const rows = members.map((m) => [
          m.className, m.name, m.kana, m.maidenName, m.lineName,
          m.attendance, m.paymentStatus, m.transferName, m.transferDate,
          m.googleEmail || '', m.note
        ]);
        const csvContent =
          '\uFEFF' +
          [headers, ...rows]
            .map((r) => r.map((v) => `"${String(v || '').replace(/"/g, '""')}"`).join(','))
            .join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `同窓会名簿_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      };

      // LINE案内文生成
      const generatedLineMessage = useMemo(() => {
        const url = settings.appUrl || window.location.href.split('?')[0];
        const fee = Number(settings.feeAmount || 0).toLocaleString();
        const bankInfo = `【振込先口座】\n銀行名：${settings.bankName || '〇〇銀行'}\n支店名：${settings.branchName || '〇〇支店'}\n口座種別・番号：${settings.accountType} ${settings.accountNumber || 'XXXXXXX'}\n口座名義：${settings.accountHolder || '〇〇〇〇'}\n会費：${fee}円\n※振込人名義は「クラス＋フルネーム（例：3-1 ヤマダタロウ）」でお願いします！`;

        if (lineTemplateType === 'initial') {
          return `【${settings.eventTitle}のご案内】\n\nみなさんお久しぶりです！同窓会の詳細が決まりましたのでご案内します。\n\n■日時：${settings.eventDate || '〇月〇日（〇）18:00〜'}\n■会場：${settings.venueName || '〇〇ホテル'}\n■会費：${fee}円\n■回答・振込期限：${settings.deadlineDate || '〇月〇日（〇）まで'}\n\n${bankInfo}\n\n▼出欠回答・振込報告フォームはこちら\n${url}\n\n⚠️【重要】Googleアカウントでのログインが必要です。\nLINEの画面内で開くとエラーになる場合があるため、右上のメニュー等から「Safari」や「Chrome」で開いて回答してください！`;
        }
        if (lineTemplateType === 'remind') {
          return `【リマインド：${settings.eventTitle}】\n\n出欠回答と会費お振込みの期限（${settings.deadlineDate || 'まもなく'}）が近づいております！\nまだフォーム送信がお済みでない方は、下記よりご回答をお願いします。\n\n${bankInfo}\n\n▼報告フォーム（Safari / Chromeで開いてください）\n${url}`;
        }
        return `【本名・LINE表示名のご確認のお願い】\n\n幹事側で名簿と振込名義を正確に照合するため、LINEの表示名がニックネーム等になっている方は、下記フォームより「本名・旧姓・LINE表示名」の登録をお願いします！\n\n▼登録フォーム（Googleログインが必要です）\n${url}`;
      }, [settings, lineTemplateType]);

      // ローディング画面
      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-4">
            <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-slate-600 font-medium">データを読み込んでいます...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* ヘッダー */}
          <header className="bg-indigo-900 text-white shadow-md">
            <div className="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="text-xl">🎓</span>
                <h1 className="font-bold text-base sm:text-lg tracking-tight">
                  {settings.eventTitle}
                </h1>
                {isSynced && (
                  <span className="hidden sm:inline-flex items-center gap-1 text-xs bg-emerald-500/20 text-emerald-200 border border-emerald-400/40 px-2 py-0.5 rounded-full">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    リアルタイム同期中
                  </span>
                )}
              </div>

              <div className="flex items-center gap-2">
                {user && (
                  <div className="hidden md:flex items-center gap-2 text-xs bg-indigo-800 px-3 py-1.5 rounded-lg">
                    <span className="text-indigo-200 truncate max-w-[160px]">{user.email}</span>
                    <button onClick={handleGoogleLogout} className="text-amber-300 hover:underline">
                      ログアウト
                    </button>
                  </div>
                )}

                {viewMode === 'participant' ? (
                  <button
                    onClick={() => setShowLoginModal(true)}
                    className="text-xs sm:text-sm bg-indigo-700 hover:bg-indigo-600 border border-indigo-500 px-3 py-1.5 rounded-lg font-medium transition"
                  >
                    🔒 幹事・管理者ページ
                  </button>
                ) : (
                  <button
                    onClick={() => setViewMode('participant')}
                    className="text-xs sm:text-sm bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-1.5 rounded-lg font-bold transition"
                  >
                    ← 参加者フォームへ戻る
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
            {/* ==================== 参加者用ビュー ==================== */}
            {viewMode === 'participant' && (
              <div className="max-w-xl mx-auto">
                {/* LINE内ブラウザ警告 */}
                {isInAppBrowser && (
                  <div className="mb-4 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                    <p className="font-bold text-amber-800 text-sm mb-1">
                      ⚠️ LINEアプリ内の画面で開いています
                    </p>
                    <p className="text-xs text-amber-700 leading-relaxed">
                      Googleのセキュリティ仕様により、LINE内のブラウザではログインがブロックされる場合があります。画面右上の「︙」や共有ボタンから<strong>「Safariで開く」</strong>または<strong>「Chromeで開く」</strong>を選択してからログインしてください。
                    </p>
                  </div>
                )}

                {!user ? (
                  /* 未ログイン時：Googleログイン案内カード */
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 text-center">
                    <div className="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                      🔐
                    </div>
                    <h2 className="text-xl font-bold text-slate-800 mb-2">
                      Googleアカウントでログインして回答
                    </h2>
                    <p className="text-sm text-slate-600 mb-6 leading-relaxed">
                      なりすまし防止および回答内容の正確な管理のため、Googleアカウントでのログインが必要です。<br />
                      <span className="text-xs text-slate-400">（※ログインしたメールアドレスは幹事の名簿管理のみに使用されます）</span>
                    </p>

                    {authError && (
                      <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg text-left">
                        {authError}
                      </div>
                    )}

                    <button
                      onClick={handleGoogleLogin}
                      className="w-full sm:w-auto inline-flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-bold border border-slate-300 rounded-xl px-6 py-3.5 shadow-sm transition"
                    >
                      <svg className="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
                      </svg>
                      Googleでログインして進む
                    </button>
                  </div>
                ) : formSubmitted ? (
                  /* 送信完了画面 */
                  <div className="bg-white rounded-2xl shadow-sm border border-emerald-200 p-8 text-center">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                      ✓
                    </div>
                    <h2 className="text-xl font-bold text-slate-800 mb-2">

                            value={settings.bankName}
                            onChange={(e) => setSettings({ ...settings, bankName: e.target.value })}
                            className="w-full border rounded-lg px-3 py-1.5 text-sm mt-1"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600">支店名</label>
                          <input
                            type="text"
                            value={settings.branchName}
                            onChange={(e) => setSettings({ ...settings, branchName: e.target.value })}
                            className="w-full border rounded-lg px-3 py-1.5 text-sm mt-1"
                          />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-bold text-slate-600">口座番号</label>
                          <input
                            type="text"
                            value={settings.accountNumber}
                            onChange={(e) => setSettings({ ...settings, accountNumber: e.target.value })}
                            className="w-full border rounded-lg px-3 py-1.5 text-sm mt-1"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600">口座名義（カナ）</label>
                          <input
                            type="text"
                            value={settings.accountHolder}
                            onChange={(e) => setSettings({ ...settings, accountHolder: e.target.value })}
                            className="w-full border rounded-lg px-3 py-1.5 text-sm mt-1"
                          />
                        </div>
                      </div>
                      <button
                        onClick={async () => {
                          await saveToCloud(settings, members);
                          alert('開催情報・口座設定をクラウドに保存しました！参加者画面にも即座に反映されます。');
                        }}
                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm"
                      >
                        設定を保存して参加者画面に反映する
                      </button>
                    </div>

                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
                      <h3 className="font-bold text-slate-800 border-b pb-2">LINEグループ用 案内文プレビュー</h3>
                      <div className="flex gap-1.5">
                        {[
                          { id: 'initial', label: '① 最初の案内' },
                          { id: 'remind', label: '② リマインド' },
                          { id: 'linecheck', label: '③ 本名確認' }
                        ].map((btn) => (
                          <button
                            key={btn.id}
                            onClick={() => setLineTemplateType(btn.id)}
                            className={`text-xs px-2.5 py-1.5 rounded-lg font-bold ${
                              lineTemplateType === btn.id
                                ? 'bg-emerald-600 text-white'
                                : 'bg-slate-100 text-slate-600'
                            }`}
                          >
                            {btn.label}
                          </button>
                        ))}
                      </div>
                      <textarea
                        rows="12"
                        readOnly
                        value={generatedLineMessage}
                        className="w-full border rounded-lg p-3 text-xs bg-slate-50 leading-relaxed"
                      />
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(generatedLineMessage);
                          setCopySuccess(true);
                          setTimeout(() => setCopySuccess(false), 2000);
                        }}
                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm"
                      >
                        {copySuccess ? '✓ コピーしました！LINEに貼り付けてください' : '📋 この案内文をコピーする'}
                      </button>
                    </div>
                  </div>
                )}

                {/* タブ4：パスワード・データ管理 */}
                {adminTab === 'system' && (
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-lg space-y-6">
                    <div>
                      <h3 className="font-bold text-slate-800 mb-2">管理者パスワードの変更</h3>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="新しいパスワード（半角英数字4文字以上）"
                          value={newPassword}
                          onChange={(e) => setNewPassword(e.target.value)}
                          className="flex-1 border rounded-lg px-3 py-2 text-sm"
                        />
                        <button
                          onClick={async () => {
                            if (!/^[a-zA-Z0-9]{4,}$/.test(newPassword)) {
                              setPasswordChangeMsg('半角英数字4文字以上で入力してください。');
                              return;
                            }
                            const next = { ...settings, adminPassword: newPassword };
                            setSettings(next);
                            await saveToCloud(next, members);
                            setNewPassword('');
                            setPasswordChangeMsg('パスワードを変更しました！');
                          }}
                          className="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-lg"
                        >
                          変更
                        </button>
                      </div>
                      {passwordChangeMsg && (
                        <p className="text-xs text-emerald-600 font-bold mt-2">{passwordChangeMsg}</p>
                      )}
                    </div>

                    <div className="border-t pt-4">
                      <h3 className="font-bold text-rose-600 mb-2">名簿データのリセット</h3>
                      <p className="text-xs text-slate-500 mb-3">
                        テスト入力した名簿データをすべて消去して空の状態に戻します。
                      </p>
                      <button
                        onClick={async () => {
                          if (confirm('本当にすべての名簿データを削除しますか？この操作は取り消せません。')) {
                            setMembers([]);
                            await saveToCloud(settings, []);
                            alert('名簿データをリセットしました。');
                          }
                        }}
                        className="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-lg"
                      >
                        名簿データを全消去する
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 管理者ログインモーダル */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-xl">
                <h3 className="font-bold text-lg text-slate-800">🔒 幹事・管理者ログイン</h3>
                <p className="text-xs text-slate-500">
                  名簿閲覧・入金確認を行うには管理者パスワードを入力してください。
                </p>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input
                    type="password"
                    placeholder="パスワードを入力"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"
                    autoFocus
                  />
                  {loginError && <p className="text-xs text-red-600">{loginError}</p>}
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setShowLoginModal(false);
                        setLoginError('');
                      }}
                      className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg"
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg"
                    >
                      ログイン
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* メンバー追加・編集モーダル */}
          {showAddModal && editingMember && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
                <h3 className="font-bold text-lg text-slate-800">メンバー情報の編集</h3>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600">クラス</label>
                    <select
                      value={editingMember.className}
                      onChange={(e) => setEditingMember({ ...editingMember, className: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    >
                      {CLASS_OPTIONS.map((c) => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600">出欠</label>
                    <select
                      value={editingMember.attendance}
                      onChange={(e) => setEditingMember({ ...editingMember, attendance: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    >
                      <option value="参加">参加</option>
                      <option value="未定">未定</option>
                      <option value="欠席">欠席</option>
                    </select>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600">氏名</label>
                    <input
                      type="text"
                      value={editingMember.name}
                      onChange={(e) => setEditingMember({ ...editingMember, name: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600">ふりがな</label>
                    <input
                      type="text"
                      value={editingMember.kana}
                      onChange={(e) => setEditingMember({ ...editingMember, kana: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600">旧姓</label>
                    <input
                      type="text"
                      value={editingMember.maidenName}
                      onChange={(e) => setEditingMember({ ...editingMember, maidenName: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600">LINE表示名</label>
                    <input
                      type="text"
                      value={editingMember.lineName}
                      onChange={(e) => setEditingMember({ ...editingMember, lineName: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600">振込状況</label>
                    <select
                      value={editingMember.paymentStatus}
                      onChange={(e) => setEditingMember({ ...editingMember, paymentStatus: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    >
                      <option value="未振込">未振込</option>
                      <option value="確認待ち">確認待ち</option>
                      <option value="振込完了">振込完了</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600">振込名義</label>
                    <input
                      type="text"
                      value={editingMember.transferName}
                      onChange={(e) => setEditingMember({ ...editingMember, transferName: e.target.value })}
                      className="w-full border rounded-lg px-2 py-1.5 text-sm mt-1"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3">
                  <button
                    onClick={() => setShowAddModal(false)}
                    className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={async () => {
                      if (!editingMember.name.trim()) return alert('氏名を入力してください');
                      const exists = members.some((m) => m.id === editingMember.id);
                      const updated = exists
                        ? members.map((m) => (m.id === editingMember.id ? editingMember : m))
                        : [editingMember, ...members];
                      setMembers(updated);
                      await saveToCloud(settings, updated);
                      setShowAddModal(false);
                    }}
                    className="px-4 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg"
                  >
                    保存
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
