    const SAMPLE_BANK_STATEMENT = `2026/11/10  振込  スズキ ダイスケ          8,000
2026/11/11  振込  ワタナベ ユイ            8,000

2026/11/12  振込  カブシキガイシャサンプル 50,000`;

    const DEFAULT_ADMIN_PASS = 'dousoukai2026';

    const DEFAULT_EVENT_INFO = {
      eventDate: '開催日時未設定',
      venue: '会場未設定',
      deadline: '期限未設定',
      bankName: '（銀行名未設定）',
      branchName: '',
      accountType: '普通',
      accountNumber: '-------',
      accountHolder: '（口座名義未設定）',
      formUrl: window.location.href.startsWith('http') ? window.location.href : ''

    const normalizeString = (str) => {
      if (!str) return '';
      return str
        .replace(/[\s　]+/g, '')
        .replace(/[ぁ-ん]/g, (s) => String.fromCharCode(s.charCodeAt(0) + 0x60))
        .replace(/旧姓[:：]/g, '')
        .toLowerCase();
    };

    function App() {
      // 画面モード: 'participant' (初期画面) | 'admin' (管理者ページ)
      const [viewMode, setViewMode] = useState('participant');

      // 初期データ読み込み中フラグ（一瞬ダミー表示されるのを防ぐ）
      const [isInitializing, setIsInitializing] = useState(true);

      // クラウド同期状態
      const [dbInstance, setDbInstance] = useState(null);
      const [userId, setUserId] = useState(null);
      const [isCloudSynced, setIsCloudSynced] = useState(false);

      // アプリデータ
      const [members, setMembers] = useState([]);
      const [feePerPerson, setFeePerPerson] = useState(8000);
      const [eventName, setEventName] = useState('同窓会 出欠・振込報告');
      const [eventInfo, setEventInfo] = useState(DEFAULT_EVENT_INFO);
      const [adminPassword, setAdminPassword] = useState(DEFAULT_ADMIN_PASS);

      // 管理者認証ステート
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [showNewPassword, setShowNewPassword] = useState(false);

      // 管理者タブ・フィルターステート
      const [activeTab, setActiveTab] = useState('roster');
      const [templateType, setTemplateType] = useState('initial');
      const [copiedTemplate, setCopiedTemplate] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('ALL');
      const [filterAttendance, setFilterAttendance] = useState('ALL');
      const [filterPayment, setFilterPayment] = useState('ALL');

      // モーダル & トースト
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [toast, setToast] = useState(null);

      // 銀行明細照合用
      const [bankText, setBankText] = useState('');
      const [reconcileResults, setReconcileResults] = useState([]);
      const [selectedMatchIds, setSelectedMatchIds] = useState([]);

      // 参加者フォーム用
      const [formInput, setFormInput] = useState({
        name: '',
        maidenName: '',
        lineName: '',
        classGroup: '3年1組',
        payerName: '',
        paymentDate: new Date().toISOString().split('T')[0],
        message: ''
      });
      const [formSubmitted, setFormSubmitted] = useState(false);

      const fileInputRef = useRef(null);
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'reunion-webapp-default';

      // ==========================================
      // 1. クラウドデータベース初期化（利用可能な環境で自動接続）
      // ==========================================
      useEffect(() => {
        const initCloud = async () => {
          try {
            if (typeof __firebase_config === 'undefined' || !window.__FirebaseModules) {
              setMembers(INITIAL_MEMBERS);
              setIsInitializing(false);
              return;
            }
            const firebaseConfig = JSON.parse(__firebase_config);
            const {
              initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
              onAuthStateChanged, getFirestore
            } = window.__FirebaseModules;

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
              if (user) {
                setUserId(user.uid);
                setDbInstance(db);
                setIsCloudSynced(true);
              } else {
                setIsInitializing(false);
              }
            });
          } catch (err) {
            console.warn('Standalone mode active (Cloud config not provided):', err);
            setMembers(INITIAL_MEMBERS);
            setIsInitializing(false);
          }
        };

        const timer = setTimeout(initCloud, 100);
        return () => clearTimeout(timer);
      }, []);

      // クラウドデータ購読（リアルタイム同期）
      useEffect(() => {
        if (!dbInstance || !userId || !window.__FirebaseModules) return;
        const { collection, doc, onSnapshot } = window.__FirebaseModules;

        let membersLoaded = false;
        let settingsLoaded = false;
        const checkAllLoaded = () => {
          if (membersLoaded && settingsLoaded) {
            setIsInitializing(false);
          }
        };

        // 名簿コレクション購読
        const membersCol = collection(dbInstance, 'artifacts', appId, 'public', 'data', 'reunion_members');
        const unsubMembers = onSnapshot(
          membersCol,
          (snapshot) => {
            if (!snapshot.empty) {
              const list = [];
              snapshot.forEach((d) => list.push(d.data()));
              list.sort((a, b) => (a.id > b.id ? 1 : -1));
              setMembers(list);
            } else {
              setMembers(INITIAL_MEMBERS);
            }
            membersLoaded = true;
            checkAllLoaded();
          },
          (error) => {
            console.error('Members sync error:', error);
            membersLoaded = true;
            checkAllLoaded();
          }
        );

        // 設定ドキュメント購読
        const settingsDoc = doc(dbInstance, 'artifacts', appId, 'public', 'data', 'reunion_settings', 'main');
        const unsubSettings = onSnapshot(
          settingsDoc,
          (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              if (data.feePerPerson !== undefined) setFeePerPerson(data.feePerPerson);
              if (data.eventName) setEventName(data.eventName);
              if (data.eventInfo) setEventInfo((prev) => ({ ...prev, ...data.eventInfo }));
              if (data.adminPassword) setAdminPassword(data.adminPassword);
            }
            settingsLoaded = true;
            checkAllLoaded();
          },
          (error) => {
            console.error('Settings sync error:', error);
            settingsLoaded = true;
            checkAllLoaded();
          }
        );

        // 万が一ネットワークが遅延した場合のセーフティタイマー
        const fallbackTimer = setTimeout(() => setIsInitializing(false), 3000);

        return () => {
          unsubMembers();
          unsubSettings();
          clearTimeout(fallbackTimer);
        };
      }, [dbInstance, userId, appId]);

      // クラウド保存ヘルパー
      const syncMemberToCloud = async (member) => {
        if (!dbInstance || !userId || !window.__FirebaseModules) return;
        try {
          const { doc, setDoc } = window.__FirebaseModules;
          await setDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'reunion_members', member.id), member);
        } catch (e) {
          console.error('Failed to sync member:', e);
        }
      };

      const deleteMemberFromCloud = async (memberId) => {
        if (!dbInstance || !userId || !window.__FirebaseModules) return;
        try {
          const { doc, deleteDoc } = window.__FirebaseModules;
          await deleteDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'reunion_members', memberId));
        } catch (e) {
          console.error('Failed to delete member:', e);
        }
      };

      const syncSettingsToCloud = async (partialSettings) => {
        if (!dbInstance || !userId || !window.__FirebaseModules) return;
        try {
          const { doc, setDoc } = window.__FirebaseModules;
          await setDoc(
            doc(dbInstance, 'artifacts', appId, 'public', 'data', 'reunion_settings', 'main'),
            partialSettings,
            { merge: true }
          );
        } catch (e) {
          console.error('Failed to sync settings:', e);
        }
      };

      // トースト通知
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast((prev) => (prev?.message === message ? null : prev));
        }, 3500);
      };

      // ==========================================
      // 2. 管理者ログイン・パスワード処理
      // ==========================================
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === adminPassword) {
          setIsAdminAuthenticated(true);
          setIsLoginModalOpen(false);
          setViewMode('admin');
          setPasswordInput('');
          setPasswordError('');
          showToast('管理者ページにログインしました');
        } else {
          setPasswordError('パスワードが正しくありません（半角英数字を確認してください）');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        setViewMode('participant');
        setFormSubmitted(false);
        showToast('管理者ページをロックし、参加者画面に戻りました');
      };

      const handleUpdatePassword = (e) => {
        e.preventDefault();
        const trimmed = newPasswordInput.trim();
        if (!trimmed || trimmed.length < 4) {
          showToast('パスワードは4文字以上の半角英数字で設定してください', 'error');
          return;
        }
        if (!/^[a-zA-Z0-9]+$/.test(trimmed)) {
          showToast('パスワードには半角英数字（a-z, A-Z, 0-9）のみ使用できます', 'error');
          return;
        }
        setAdminPassword(trimmed);
        syncSettingsToCloud({ adminPassword: trimmed });
        setNewPasswordInput('');
        showToast('管理者パスワードを変更しました！');
      };

      // ==========================================
      // 3. 集計・フィルタリング・LINE案内文生成
      // ==========================================
      const stats = useMemo(() => {
        const totalCount = members.length;
        const attendingMembers = members.filter((m) => m.attendance === 'attending');
        const attendingCount = attendingMembers.length;
        const paidMembers = members.filter((m) => m.paymentStatus === 'paid');
        const paidCount = paidMembers.length;
        const pendingReviewCount = members.filter((m) => m.paymentStatus === 'pending_review').length;
        const unpaidAttendingCount = attendingMembers.filter((m) => m.paymentStatus !== 'paid').length;

        const expectedTotalAmount = attendingCount * feePerPerson;
        const collectedTotalAmount = paidCount * feePerPerson;
        const collectionRate = expectedTotalAmount > 0
          ? Math.min(100, Math.round((collectedTotalAmount / expectedTotalAmount) * 100))
          : 0;

        return {
          totalCount, attendingCount, paidCount, pendingReviewCount,
          unpaidAttendingCount, expectedTotalAmount, collectedTotalAmount, collectionRate
        };
      }, [members, feePerPerson]);

      const classOptions = useMemo(() => {
        const classes = new Set([...CLASS_LIST, ...members.map((m) => m.classGroup).filter(Boolean)]);
        return Array.from(classes);
      }, [members]);

      const filteredMembers = useMemo(() => {
        return members.filter((member) => {
          if (filterClass !== 'ALL' && member.classGroup !== filterClass) return false;
          if (filterAttendance !== 'ALL' && member.attendance !== filterAttendance) return false;
          if (filterPayment !== 'ALL' && member.paymentStatus !== filterPayment) return false;

          if (searchQuery.trim() !== '') {
            const q = normalizeString(searchQuery);
            const rawQ = searchQuery.toLowerCase().trim();
            const hit =
              normalizeString(member.name).includes(q) ||
              normalizeString(member.kana).includes(q) ||
              normalizeString(member.maidenName).includes(q) ||
              normalizeString(member.lineName).includes(q) ||
              (member.lineName && member.lineName.toLowerCase().includes(rawQ)) ||
              normalizeString(member.payerName).includes(q) ||
              member.id.toLowerCase().includes(rawQ) ||
              (member.memo && member.memo.toLowerCase().includes(rawQ));
            if (!hit) return false;
          }
          return true;
        });
      }, [members, filterClass, filterAttendance, filterPayment, searchQuery]);

      const generatedLineMessage = useMemo(() => {
        const feeText = `¥${feePerPerson.toLocaleString()}`;
        if (templateType === 'initial') {
          return `【${eventName}のご案内】🎓✨

みなさんお久しぶりです！
下記の通り同窓会を開催しますので、出欠と会費のお振込みをお願いいたします🙇‍♂️

━━━━━━━━━━━━━━
📅 日時：${eventInfo.eventDate}
📍 会場：${eventInfo.venue}
💰 会費：${feeText}（事前振込制）
⏰ 回答・振込期限：${eventInfo.deadline}
━━━━━━━━━━━━━━

■ お振込先口座
銀行名：${eventInfo.bankName}
支店名：${eventInfo.branchName}
口座種別：${eventInfo.accountType}
口座番号：${eventInfo.accountNumber}
口座名義：${eventInfo.accountHolder}

⚠️【重要なお願い】
LINEの表示名だけだと本名が分からないメンバーがいるため、お振込み後に必ず下記フォームから「本名・旧姓・LINE表示名」の報告をお願いします！
（振込名義の前にクラスを入れると助かります 例：3-1 ヤマダタロウ）

📝 出欠・振込報告フォーム：
${eventInfo.formUrl}

久々にみんなと集まれるのを楽しみにしています！拡散・招待もよろしくお願いします🙌`;
        }
        if (templateType === 'reminder') {
          return `【リマインド】${eventName} 出欠・会費振込について⏰

みなさんお疲れさまです！
同窓会の回答・お振込期限（${eventInfo.deadline}）が近づいてまいりました📣

まだ回答・お振込みがお済みでない方は、会場手配の都合上、期限までにお手続きをお願いいたします🙇‍♀️

━━━━━━━━━━━━━━
📅 日時：${eventInfo.eventDate}
📍 会場：${eventInfo.venue}
💰 会費：${feeText}
⏰ 締切：${eventInfo.deadline}
━━━━━━━━━━━━━━

■ お振込先
${eventInfo.bankName} ${eventInfo.branchName}
（${eventInfo.accountType}）${eventInfo.accountNumber}
名義：${eventInfo.accountHolder}

      const cycleAttendance = (id) => {
        const order = ['attending', 'pending', 'absent'];
        setMembers((prev) =>
          prev.map((m) => {
            if (m.id !== id) return m;
            const nextStatus = order[(order.indexOf(m.attendance) + 1) % order.length];
            const updated = { ...m, attendance: nextStatus };
            syncMemberToCloud(updated);
            return updated;
          })
        );
      };

      const cyclePaymentStatus = (id) => {
        const order = ['unpaid', 'pending_review', 'paid'];
        const today = new Date().toISOString().split('T')[0];
        setMembers((prev) =>
          prev.map((m) => {
            if (m.id !== id) return m;
            const nextStatus = order[(order.indexOf(m.paymentStatus) + 1) % order.length];
            const updated = {
              ...m,
              paymentStatus: nextStatus,
              paymentDate: nextStatus === 'paid' && !m.paymentDate ? today : m.paymentDate,
              payerName: nextStatus === 'paid' && !m.payerName ? m.kana || m.name : m.payerName
            };
            syncMemberToCloud(updated);
            return updated;
          })
        );
      };

        const isExisting = Boolean(editingMember._isExisting);
        const cleanMember = { ...editingMember };
        delete cleanMember._isExisting;

        setMembers((prev) => {
          if (isExisting) {
            syncMemberToCloud(cleanMember);
            return prev.map((m) => (m.id === cleanMember.id ? cleanMember : m));
          } else {
            const uniqueId = prev.some((m) => m.id === cleanMember.id)
              ? `${cleanMember.id}-${Date.now().toString().slice(-3)}`

            const newItem = { ...cleanMember, id: uniqueId };
            syncMemberToCloud(newItem);
            return [newItem, ...prev];

      const handleExportCSV = () => {
        const headers = ['ID', '氏名', 'ふりがな', '旧姓等', 'LINE表示名', 'クラス', '出欠', '振込状況', '振込名義人', '振込日', 'メモ'];
        const attendanceMap = { attending: '参加', absent: '欠席', pending: '未定' };
        const paymentMap = { paid: '振込完了', pending_review: '確認待ち', unpaid: '未振込' };

        const rows = members.map((m) => [
          m.id, m.name, m.kana, m.maidenName, m.lineName || '', m.classGroup,
          attendanceMap[m.attendance] || m.attendance,
          paymentMap[m.paymentStatus] || m.paymentStatus,
          m.payerName, m.paymentDate, (m.memo || '').replace(/\r?\n/g, ' ')
        ]);

        const csvContent = '\uFEFF' + [headers, ...rows]
          .map((row) => row.map((cell) => `"${String(cell || '').replace(/"/g, '""')}"`).join(','))
          .join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `同窓会名簿_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('CSVファイルをダウンロードしました');
      };

      const handleImportCSV = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const text = event.target?.result;
            if (typeof text !== 'string') return;
            const lines = text.split(/\r?\n/).filter((line) => line.trim() !== '');
            if (lines.length < 2) {
              showToast('有効なデータ行が見つかりませんでした', 'error');
              return;
            }
            const parseCSVLine = (line) => {
              const result = [];
              let current = '';
              let inQuotes = false;
              for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                  if (inQuotes && line[i + 1] === '"') {
                    current += '"';
                    i++;
                  } else {
                    inQuotes = !inQuotes;
                  }
                } else if (char === ',' && !inQuotes) {
                  result.push(current.trim());
                  current = '';
                } else {
                  current += char;
                }
              }
              result.push(current.trim());
              return result;
            };

            const imported = [];
            for (let i = 1; i < lines.length; i++) {
              const cols = parseCSVLine(lines[i]);
              if (cols.length < 2 || !cols[1]) continue;
              const hasLineCol = cols.length >= 11;
              const lineName = hasLineCol ? cols[4] || '' : '';
              const classGroup = hasLineCol ? cols[5] || '3年1組' : cols[4] || '3年1組';
              const attRaw = hasLineCol ? cols[6] || '' : cols[5] || '';
              const payRaw = hasLineCol ? cols[7] || '' : cols[6] || '';
              const payerName = hasLineCol ? cols[8] || '' : cols[7] || '';
              const paymentDate = hasLineCol ? cols[9] || '' : cols[8] || '';
              const memo = hasLineCol ? cols[10] || '' : cols[9] || '';

              const attendance = attRaw.includes('参加') ? 'attending' : attRaw.includes('欠席') ? 'absent' : 'pending';
              const paymentStatus = payRaw.includes('完了') ? 'paid' : payRaw.includes('確認') ? 'pending_review' : 'unpaid';

              const item = {
                id: cols[0] || `IMP-${String(i).padStart(2, '0')}`,
                name: cols[1],
                kana: cols[2] || '',
                maidenName: cols[3] || '',
                lineName,
                classGroup,
                attendance,
                paymentStatus,
                payerName,
                paymentDate,
                memo
              };
              imported.push(item);
              syncMemberToCloud(item);
            }

            if (imported.length > 0) {
              setMembers((prev) => [...imported, ...prev]);
              showToast(`${imported.length}件のメンバーデータをインポートしました`);
            }
          } catch {
            showToast('CSVの読み込みに失敗しました', 'error');
          }
          e.target.value = '';
        };
        reader.readAsText(file, 'UTF-8');
      };

      const handleAnalyzeBankText = () => {
        if (!bankText.trim()) {
          showToast('銀行の入出金明細テキストを貼り付けてください', 'error');
          return;
        }
        const lines = bankText.split(/\r?\n/).filter((l) => l.trim().length > 0);
        const matches = [];
        lines.forEach((line, idx) => {
          const normalizedLine = normalizeString(line);
          const dateMatch = line.match(/(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/);
          const extractedDate = dateMatch ? dateMatch[1].replace(/\//g, '-') : new Date().toISOString().split('T')[0];

          const matchedMember = members.find((m) => {
            const candidates = [
              normalizeString(m.payerName),
              normalizeString(m.kana),
              normalizeString(m.name),
              normalizeString(m.maidenName)
            ].filter((c) => c.length >= 2);
            return candidates.some((cand) => normalizedLine.includes(cand));
          });

          matches.push({
            lineIndex: idx,
            rawLine: line.trim(),
            extractedDate,
            member: matchedMember || null,
            alreadyPaid: matchedMember ? matchedMember.paymentStatus === 'paid' : false
          });
        });

        setReconcileResults(matches);
        setSelectedMatchIds(matches.filter((r) => r.member && !r.alreadyPaid).map((r) => r.member.id));
        if (matches.some((m) => m.member)) {
          showToast(`${matches.filter((m) => m.member).length}件の一致候補が見つかりました`);
        } else {
          showToast('名簿と一致する振込データが見つかりませんでした', 'error');
        }
      };

      const handleApplyReconciliation = () => {
        if (selectedMatchIds.length === 0) return;
        const matchMap = new Map();
        reconcileResults.forEach((r) => {
          if (r.member && selectedMatchIds.includes(r.member.id)) {
            matchMap.set(r.member.id, r);
          }
        });

        setMembers((prev) =>
          prev.map((m) => {
            const match = matchMap.get(m.id);
            if (!match) return m;
            const updated = {
              ...m,
              attendance: m.attendance === 'pending' ? 'attending' : m.attendance,
              paymentStatus: 'paid',
              paymentDate: match.extractedDate || m.paymentDate || new Date().toISOString().split('T')[0],
              payerName: m.payerName || m.kana || m.name
            };
            syncMemberToCloud(updated);
            return updated;
          })
        );

        showToast(`${selectedMatchIds.length}名を「振込完了」に一括更新しました！`);
        setReconcileResults([]);
        setSelectedMatchIds([]);
        setBankText('');
        setActiveTab('roster');

      const handleParticipantFormSubmit = (e) => {

                : m.memo;
              const updatedMember = {

                name: formInput.name.trim(),
                maidenName: formInput.maidenName ? `旧姓：${formInput.maidenName.replace(/^旧姓[:：]?/, '')}` : m.maidenName,

                payerName: formInput.payerName.trim(),
                paymentDate: formInput.paymentDate,
                memo: appendedMemo
              };
              syncMemberToCloud(updatedMember);
              return updatedMember;
            }
            return m;
          });

          if (!matchedExisting) {

            };
            syncMemberToCloud(newMember);
            return [newMember, ...updated];

          return updated;

                <form onSubmit={handleSaveMember} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">出席番号 / ID</label>
                      <input
                        type="text"
                        value={editingMember.id}
                        disabled={editingMember._isExisting}
                        onChange={(e) => setEditingMember({ ...editingMember, id: e.target.value })}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-slate-50 disabled:text-slate-400"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">クラス / 組</label>
                      <select
                        value={editingMember.classGroup}
                        onChange={(e) => setEditingMember({ ...editingMember, classGroup: e.target.value })}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white"
                      >
                        {CLASS_LIST.map((cls) => <option key={cls} value={cls}>{cls}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">氏名（本名） <span className="text-rose-500">*</span></label>
                      <input
                        type="text"
                        required
                        value={editingMember.name}
                        onChange={(e) => setEditingMember({ ...editingMember, name: e.target.value })}
                        placeholder="例：高橋 美咲"
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">ふりがな</label>
                      <input
                        type="text"
                        value={editingMember.kana}
                        onChange={(e) => setEditingMember({ ...editingMember, kana: e.target.value })}
                        placeholder="例：たかはし みさき"
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">旧姓</label>
                      <input
                        type="text"
                        value={editingMember.maidenName}
                        onChange={(e) => setEditingMember({ ...editingMember, maidenName: e.target.value })}
                        placeholder="例：旧姓：佐藤"
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">LINE表示名</label>
                      <input
                        type="text"
                        value={editingMember.lineName}
                        onChange={(e) => setEditingMember({ ...editingMember, lineName: e.target.value })}
                        placeholder="例：みさき🌸"
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">出欠ステータス</label>
                      <select
                        value={editingMember.attendance}
                        onChange={(e) => setEditingMember({ ...editingMember, attendance: e.target.value })}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white"
                      >
                        <option value="attending">参加</option>
                        <option value="pending">未定</option>
                        <option value="absent">欠席</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">振込ステータス</label>
                      <select
                        value={editingMember.paymentStatus}
                        onChange={(e) => setEditingMember({ ...editingMember, paymentStatus: e.target.value })}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white"
                      >
                        <option value="unpaid">未振込</option>
                        <option value="pending_review">確認待ち</option>
                        <option value="paid">振込完了</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">振込名義人（カタカナ等）</label>
                      <input
                        type="text"
                        value={editingMember.payerName}
                        onChange={(e) => setEditingMember({ ...editingMember, payerName: e.target.value })}
                        placeholder="例：タカハシ ミサキ"
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">振込日</label>
                      <input
                        type="date"
                        value={editingMember.paymentDate}
                        onChange={(e) => setEditingMember({ ...editingMember, paymentDate: e.target.value })}
                        className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">メモ（アレルギー・二次会参加・連絡事項など）</label>
                    <textarea
                      rows={3}
                      value={editingMember.memo}
                      onChange={(e) => setEditingMember({ ...editingMember, memo: e.target.value })}
                      placeholder="自由記入欄"
                      className="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">
                      キャンセル
                    </button>
                    <button type="submit" className="px-5 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm">
                      保存する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* カスタム確認ダイアログ */}
          {confirmDialog && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <h3 className="text-base font-bold text-slate-900">{confirmDialog.title}</h3>
                <p className="text-sm text-slate-600 leading-relaxed">{confirmDialog.message}</p>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setConfirmDialog(null)} className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">
                    キャンセル
                  </button>
                  <button type="button" onClick={confirmDialog.onConfirm} className="px-4 py-2 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl">
                    実行する
                  </button>
                </div>
              </div>
            </div>
          )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
